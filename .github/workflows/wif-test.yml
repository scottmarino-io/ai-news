name: WIF test
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub OIDC token
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > /tmp/gha-jwt

      - name: Exchange for Anthropic token
        run: |
          JWT=$(cat /tmp/gha-jwt)
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01Gqy4Wrg6hPR1gdCPHqL7DA",
            "organization_id": "41cb9138-3214-4601-8a0f-fb6c20870f4d",
            "service_account_id": "svac_011WLbETF1cCD7fafrRhCAyK",
            "workspace_id": "wrkspc_01PD73c18kzdMf7mcydJaKTe"
          }
          JSON